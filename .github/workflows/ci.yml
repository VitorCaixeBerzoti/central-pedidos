name: Verificar Órbita
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: orbita_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_only@localhost:5432/orbita_ci
      JWT_SECRET: orbita_ci_exclusivo_testes_nao_usar_em_producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-do-navegador
          path: |
            playwright-report
            test-results
